name: release

# Pushing a package.json version that is not on npm yet releases it.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (otherwise build, test and pack only)
        type: boolean
        default: false

permissions:
  contents: write # tag and create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "mysql-wasm@$version" version > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    # A clean build compiles MySQL and OpenSSL to wasm twice over.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build bison pkg-config libssl-dev libncurses-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9

      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export JOBS="$(nproc)"
          ./scripts/build-dependencies
          ./scripts/build-emscripten

      - name: Test
        run: |
          npm ci
          npm test
          ./scripts/smoke-innodb

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: mysql-wasm
          path: ${{ runner.temp }}/mysql-wasm-*.tgz
          retention-days: 14

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.publish
        # Trusted publishing exchanges the workflow's OIDC token for npm
        # credentials, so no npm token is stored in the repository.
        run: npm publish "$RUNNER_TEMP"/mysql-wasm-*.tgz --access public --provenance

      - name: Create the GitHub release
        if: github.event_name == 'push' || inputs.publish
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP"/mysql-wasm-*.tgz \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
